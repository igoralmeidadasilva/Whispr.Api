services:
  postgres:
    image: postgres:16
    container_name: whispr-postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - whispr-postgres-data:/var/lib/postgresql/data      
    networks:
      - whispr-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whispr-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - 5050:80
    depends_on:
      - postgres
    networks:
      - whispr-network

volumes:
  whispr-postgres-data:

networks:
  whispr-network:
    driver: bridge