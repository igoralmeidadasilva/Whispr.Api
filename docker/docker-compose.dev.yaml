services:
  postgres:
    image: postgres:16
    container_name: whispr-postgres
    restart: always
    environment:
      POSTGRES_DB: whispr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432:5432
    volumes:
      - whispr-postgres-data:/var/lib/postgresql/data      
    networks:
      - whispr-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whispr-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@email.com
      PGADMIN_DEFAULT_PASSWORD: 123456
    ports:
      - 5050:80
    depends_on:
      - postgres
    networks:
      - whispr-network

  seq:
    image: datalust/seq:latest
    container_name: whispr-seq
    environment:
      ACCEPT_EULA: Y
      SEQ_FIRSTRUN_ADMINPASSWORD: 123456
    ports:
      - "5341:80"
    volumes:
      - whispr-seq-data:/data
    restart: unless-stopped

volumes:
  whispr-postgres-data:
  whispr-seq-data:

networks:
  whispr-network:
    driver: bridge