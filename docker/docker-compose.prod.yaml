services:
  postgres:
    image: postgres:16
    container_name: whispr-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5432:5432
    volumes:
      - whispr-postgres-data:/var/lib/postgresql/data      
    networks:
      - whispr-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: whispr-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - 5050:80
    depends_on:
      - postgres
    networks:
      - whispr-network

volumes:
  whispr-postgres-data:

networks:
  whispr-network:
    driver: bridge